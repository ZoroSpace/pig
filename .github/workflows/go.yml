name: Go

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      # Full race regression, run once (repo convention), with explicit timeout.
      - name: Test
        run: go test ./... -race -count=1 -timeout 600s -coverprofile=coverage.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.out
          # Tokenless upload works for public repos but is rate-limited on
          # shared runners; set CODECOV_TOKEN repo secret to make it reliable.
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
